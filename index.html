<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Carnet de prières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#23201a;--muted:#6f6656;--gold:#9a7a3a;--add-bg:#f1e6cc;--line:#e3d9c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--paper:#1e1b15;--ink:#ece4d2;--muted:#a89d86;--gold:#d1b06b;--add-bg:#3a3020;--line:#3a3428}}
:root[data-theme="dark"]{--bg:#16140f;--paper:#1e1b15;--ink:#ece4d2;--muted:#a89d86;--gold:#d1b06b;--add-bg:#3a3020;--line:#3a3428}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:18px;line-height:1.6}
main{max-width:820px;margin:0 auto;padding:40px 16px 80px}
header{text-align:center;margin-bottom:32px}
.bh{font-family:"Frank Ruhl Libre",serif;color:var(--gold);font-size:15px}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:500;font-size:36px;margin:10px 0 4px}
.sub{font-style:italic;color:var(--muted)}
form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}
input,button{font:inherit;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button{background:var(--gold);color:#fff;border-color:var(--gold);cursor:pointer}
#err{color:#b3472d;text-align:center;min-height:1.6em}
details.day{margin:0 0 18px}
details.day>summary{list-style:none;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
details.day>summary::-webkit-details-marker{display:none}
summary .d{color:var(--gold);font-weight:500}
summary [lang=he]{font-family:"Frank Ruhl Libre",serif;font-size:20px}
.yt{display:inline-block;margin:12px 0 18px;color:var(--gold)}
section{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px 28px 20px;margin:0 0 22px;position:relative}
.num{position:absolute;top:-13px;left:24px;background:var(--bg);color:var(--gold);font-size:14px;padding:0 8px}
h2{margin:0 0 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
h2 [lang=he]{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:24px;color:var(--gold)}
.fr-t{font-size:16px;font-style:italic;color:var(--muted);font-weight:400}
.he{font-family:"Frank Ruhl Libre",serif;font-size:24px;line-height:2;text-align:justify;margin:0 0 18px}
.add{background:var(--add-bg);border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px}
.fr{margin:0 0 10px}
.refs{font-size:14px;color:var(--muted);margin:0}
.annex{font-size:16px}
.annex h2{font-size:22px;font-family:"Frank Ruhl Libre",serif;color:var(--gold);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.lock{text-align:center;margin-top:8px}
.lock button{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}
@media (max-width:560px){body{font-size:17px}.he{font-size:21px}section{padding:24px 16px 16px}h1{font-size:30px}}
</style></head><body><main>
<header>
  <div class="bh" lang="he" dir="rtl">בס״ד</div>
  <h1 lang="he" dir="rtl">תְּפִלּוֹתַי</h1>
  <div class="sub">Carnet de prières de David, d'après le Likouté Tefilot de Rabbi Nathan.</div>
  <form id="f"><label for="pw" style="position:absolute;left:-9999px">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
    <button>Ouvrir</button></form>
  <div id="err" role="alert"></div>
</header>
<div id="list"></div>
<div class="lock" id="lockw" hidden><button id="lock">Verrouiller cet appareil</button></div>
</main>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const M = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmt = d => { const [y,m,j] = d.split('-').map(Number); return `${j} ${M[m-1]} ${y}`; };
let blob;
async function open(pw) {
  blob = blob || await (await fetch('prieres.enc', {cache: 'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iter},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(data) {
  document.getElementById('f').hidden = true; document.getElementById('lockw').hidden = false;
  document.getElementById('list').innerHTML = data.prieres.map((p, i) => `
    <details class="day"${i === 0 ? ' open' : ''}><summary><span class="d">${fmt(p.date)}</span><span lang="he" dir="rtl">${p.title}</span></summary>
    ${p.youtube ? `<a class="yt" href="${p.youtube}" target="_blank" rel="noopener">▶ La vidéo sur YouTube (privée)</a>` : ''}
    ${p.html}</details>`).join('');
}
async function tryOpen(pw, remember) {
  try { const d = await open(pw); show(d); if (remember) try { localStorage.setItem('tefilot_pw', pw); } catch (e) {} }
  catch (e) { document.getElementById('err').textContent = 'Mot de passe incorrect.'; try { localStorage.removeItem('tefilot_pw'); } catch (_) {} }
}
document.getElementById('f').addEventListener('submit', ev => { ev.preventDefault(); document.getElementById('err').textContent = ''; tryOpen(document.getElementById('pw').value, true); });
document.getElementById('lock').addEventListener('click', () => { try { localStorage.removeItem('tefilot_pw'); } catch (e) {} location.reload(); });
let saved = null; try { saved = localStorage.getItem('tefilot_pw'); } catch (e) {}
if (saved) tryOpen(saved, false);
</script></body></html>
